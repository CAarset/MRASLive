name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg (movies)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: PDEBench Darcy data, cached
        id: darcy
        uses: actions/cache@v4
        with:
          path: data/2D_DarcyFlow_beta100.0_Train.hdf5
          key: pdebench-darcy-7c09f3b1bb097737d3fd52ffb0c6f1c8

      - name: PDEBench Darcy data, download
        if: steps.darcy.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/2D_DarcyFlow_beta100.0_Train.hdf5 \
            https://darus.uni-stuttgart.de/api/access/datafile/133221
          echo "7c09f3b1bb097737d3fd52ffb0c6f1c8  data/2D_DarcyFlow_beta100.0_Train.hdf5" | md5sum -c -

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ngsrng needs torch; the CPU build, not the CUDA one
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[notebook,dev]"

      - name: Tests
        run: pytest -q
