[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mras"
version = "0.1.0"
description = "Data assimilation via model reference adaptation (MRAS) for linear and nonlinear parabolic PDEs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ngsolve>=6.2",
    # The author's own packages, from GitHub and unpinned (the latest commit
    # of the default branch): pictures, and random fields for data noise.
    # Update with `pip install -U --force-reinstall --no-deps ngsplot ngsrng`
    # (from these URLs); develop one locally with `pip install -e ../ngsplot`.
    "ngsplot @ git+https://github.com/CAarset/ngsplot.git",
    "ngsrng @ git+https://github.com/CAarset/ngsrng.git",
    "numpy",
    "matplotlib",
    "pydantic>=2",
    "PyYAML",
    "h5py",  # run checkpoints (mras.checkpoint) and the PDEBench Darcy data
]

[project.optional-dependencies]
notebook = ["anywidget"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mras*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
